# WorkNest Database Configuration

# Dynamic Datasource: Defaults to TiDB Cloud with Environment Variable override support for Cloud Deployments (Railway, Render, AWS, Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:4EcRPJcgLgQx9tZ.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:FWbQls3zsarzxLxv}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP Connection Pool Config (Prevents TiDB Cloud idle connection timeouts & dropped sockets)
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1

# Spring Web Configuration - listens to dynamic cloud $PORT or defaults to 8080
server.port=${PORT:8080}

